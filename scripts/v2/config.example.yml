############################## Example config file for proteogram v2 pipeline ##############################
#
# This is an example config file for the proteogram v2 pipeline. It contains all the keys that can be used
# in the config file, with default values and comments explaining their purpose. You can copy this file 
# (as config.yml) to a this same directory and edit it to suit your needs.
#
#############################################################################################################

# For create_proteograms.py and create_v2_proteograms.py
limit_file: '' # optional, limit to these structures, .ent file base name one per line
scope_structures_dir: '' # input structures, .ent/.pdb file format
all_proteograms_dir: '' # input proteogram dir for all structures
cg_method: 'martini' # coarse-grained (CG) method: 'martini' or null/empty for full atomistic

# for measure_similarity_single_domain.py
proteograms_dir_single_search: '' # dir of proteograms to search against

# for split_pdb_into_chains.py
pdb_download_dir: '../data/pdb_download'   # downloaded full PDB files
pdb_monomers_dir: '../data/pdb_monomers'   # output: {PDBID}_{CHAIN}.pdb per chain

# for create_pdb_annotation_file.py (PDB-based pipeline, no SCOPe required)
# for create_scope_annotation_file.py / create_annotation_file.py (SCOPe pipeline)
annot_file: './<path>/ProteogramData_RCSB_PDBe_AnnotationsLookup.tsv'
fasta_style_file: './<path>/structure_based_seqs.fa'
# GO OBO files — downloaded automatically from geneontology.org if absent
go_obo_file: '../data/go/go-basic.obo'
goslim_obo_file: '../data/go/goslim_generic.obo'
  
# for make_training_data.py
scope_level: '' # family, superfamily, fold or class
scope_eval_set: '' # file to indicate proteins to be excluded, .ent file base name one per line
scope_cla_file: './data/dir.cla.scope.2.08-stable.txt'
scope_des_file: './data/dir.des.scope.2.08-stable.txt'
scope_hie_file: './data/dir.hie.scope.2.08-stable.txt'
training_structures_dir: '' # copy structures used for proteograms for gtalign runs (for eval)
training_proteograms_dir: '' # output dir
label_df_out: './<path>/scope2.08_annotations_for_pdb.tsv' # annotations output file

# for train_multiple_models.py - ResNet18 or CNN training
# These are the default values for training multiple models. They can be overridden by command line arguments.
training_data_dir: '' # input proteogram dir
num_epochs: 25 # can be overridden by command line argument
learning_rate: 0.001 # can be overridden by command line argument
batch_size: 8 # can be overridden by command line argument
pretrained: True # True or False
model_file_prefix: 'scope_cnn_model' # parameters will be appended to this prefix
 
# for measure_similarity.py
proteograms_for_sim_dir: '' # input proteogram dir for similarity search
model_file: './<path>/scope_cnn_model.pt' # model file for embedding proteograms for similarity search
# Grid size + preprocessing mode for search images in measure_similarity_v2.py /
# query_similar_proteins.py (CNN/ResNet18 only). These are FALLBACKS: checkpoints
# trained by train_multiple_models_randomized_eval.py self-describe their grid
# (input_size) and mode (resize) in their meta and override these automatically.
# Only used for legacy checkpoints that lack meta. For legacy checkpoints, search_grid_size MUST match the
# training grid, and search_resize MUST match whether the model was trained with
# --resize, or images get cropped/reframed at the wrong scale at search time. If you are using a checkpoint trained by train_multiple_models_randomized_eval.py, you can omit these keys and the checkpoint meta will be used.
search_grid_size: 200
search_resize: false
top_k: 5
embed_file_exists: 'False' # either "True" or "False" if you have "embeddings.pt"
embed_file: './<path>/embeddings.pt' # name of pytorch tensors file representing embeddings of proteograms
search_images_dir: './<path>/search_images_dir' # search results (top k protegram hits per query)
proteogram_sim_results: './<path>/proteogram_similarity_results.tsv' # similarity results (top k) as table

# for evaluate_methods.py
gtalign_results_dir: '<path>/gtalign_out' # dir name for gtalign output
usalign_results: './<path>/usalign_out.tsv' # tab-delimited ouptut from USalign
foldseek_results: './<path>/foldseek_out.tsv' # optional; 3-col TSV from foldseek easy-search --format-output "query,target,qtmscore"; omit key to skip Foldseek in evaluation
save_bad_searches_dir: './<path>/bad_proteogram_searches' # dir for poor search result images
save_good_searches_dir: './<path>/good_proteogram_searches' # dir for very good search result images